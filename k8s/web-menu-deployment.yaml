apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-menu
  namespace: milestones-coffee
  labels:
    app: web-menu
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-menu
  template:
    metadata:
      labels:
        app: web-menu
        version: v1
    spec:
      serviceAccountName: web-menu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - web-menu
                topologyKey: kubernetes.io/hostname

      containers:
        - name: web-menu
          image: ghcr.io/milestones-coffee/web-menu:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3003
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.milestones.coffee"
            - name: ISR_REVALIDATE
              value: "300"

          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: web-menu
  namespace: milestones-coffee
  labels:
    app: web-menu
spec:
  type: ClusterIP
  selector:
    app: web-menu
  ports:
    - name: http
      port: 3003
      targetPort: http
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-menu
  namespace: milestones-coffee
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-menu
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-menu
  namespace: milestones-coffee
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web-menu

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-menu
  namespace: milestones-coffee
