name: Deploy MS QR Code to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: merging several PRs quickly started overlapping deploys that
# ran git reset / docker build on the VPS at the same time and failed. Queue them instead.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_MENU: ${{ github.repository }}/menu-app
  IMAGE_NAME_ADMIN: ${{ github.repository }}/admin-dashboard

jobs:
  # Tests must pass before anything is built or deployed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @milestones/api test
      - run: pnpm --filter @milestones/api lint
      - run: pnpm --filter @milestones/menu-app lint
      - run: pnpm --filter @milestones/admin-dashboard lint

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:buildcache,mode=max

      - name: Build and push Menu App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/menu-app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MENU }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MENU }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MENU }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MENU }}:buildcache,mode=max

      - name: Build and push Admin Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/admin-dashboard/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ADMIN }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ADMIN }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ADMIN }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ADMIN }}:buildcache,mode=max

      - name: Check VPS_HOST value (fingerprint only)
        env:
          VPS_HOST_VALUE: ${{ secrets.VPS_HOST }}
        run: |
          echo "saved length=${#VPS_HOST_VALUE} sha256=$(printf '%s' "$VPS_HOST_VALUE" | sha256sum | cut -c1-16)"
          echo "expected length=15 sha256=$(printf '%s' '194.164.151.202' | sha256sum | cut -c1-16)"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          COMPANY_TRN: ${{ secrets.COMPANY_TRN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
        with:
          envs: JWT_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD,COMPANY_TRN,FCM_SERVICE_ACCOUNT,APNS_KEY,APNS_KEY_ID,APNS_TEAM_ID
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch --all
            git reset --hard origin/main
            umask 077
            # Secrets arrive as environment variables, not pasted into the script text.
            printf 'JWT_SECRET=%s\nADMIN_EMAIL=%s\nADMIN_PASSWORD=%s\nCOMPANY_TRN=%s\nFCM_SERVICE_ACCOUNT=%s\nAPNS_KEY=%s\nAPNS_KEY_ID=%s\nAPNS_TEAM_ID=%s\n' "$JWT_SECRET" "$ADMIN_EMAIL" "$ADMIN_PASSWORD" "$COMPANY_TRN" "$FCM_SERVICE_ACCOUNT" "$APNS_KEY" "$APNS_KEY_ID" "$APNS_TEAM_ID" > .env
            echo "--- database backup (keeps the newest 5) ---"
            BK="$HOME/msqrcode-backups"; mkdir -p "$BK"
            OUT="$BK/msqrcode-$(date +%Y%m%d-%H%M%S).sql.gz"
            if (set -o pipefail; docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U postgres msqrcode | gzip > "$OUT"); then
              ls -1t "$BK"/msqrcode-*.sql.gz | tail -n +6 | xargs -r rm -f
              ls -lh "$OUT"
            else
              echo "WARNING: backup failed (deploy continues)"; rm -f "$OUT"
            fi
            docker compose -f docker-compose.prod.yml pull postgres redis || true
            echo "--- disk ---"; df -h / | tail -1
            docker compose -f docker-compose.prod.yml build --no-cache api menu-app admin-dashboard
            echo "--- api image built at ---"; docker image inspect -f '{{.Created}}' msqrcode-api || true
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "--- nginx for coffeesales.ae ---"
            CERT=/etc/letsencrypt/live/coffeesales.ae/fullchain.pem
            if [ ! -f "$CERT" ]; then
              cat > /etc/nginx/sites-available/coffeesales.ae <<'NGINX'
            server {
                listen 80;
                server_name coffeesales.ae www.coffeesales.ae;
                client_max_body_size 10m;

                location = /api/health {
                    proxy_pass http://127.0.0.1:3016/api/health;
                    proxy_set_header Host $host;
                }

                location /api/ {
                    proxy_pass http://127.0.0.1:3016/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    proxy_pass http://127.0.0.1:3017;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX
              ln -sf /etc/nginx/sites-available/coffeesales.ae /etc/nginx/sites-enabled/coffeesales.ae
              if ! nginx -t; then
                echo "nginx config invalid: removing coffeesales.ae config"
                rm -f /etc/nginx/sites-enabled/coffeesales.ae /etc/nginx/sites-available/coffeesales.ae
                nginx -t
                exit 1
              fi
              systemctl reload nginx
              if [ -n "${{ secrets.CERTBOT_EMAIL }}" ]; then
                certbot --nginx -n --agree-tos -m "${{ secrets.CERTBOT_EMAIL }}" -d coffeesales.ae -d www.coffeesales.ae --redirect || echo "WARNING: certificate not issued (check DNS for www.coffeesales.ae); site stays on HTTP"
              fi
            fi
            ADMIN_CERT=/etc/letsencrypt/live/admin.coffeesales.ae/fullchain.pem
            if [ ! -f "$ADMIN_CERT" ]; then
              cat > /etc/nginx/sites-available/admin.coffeesales.ae <<'NGINX'
            server {
                listen 80;
                server_name admin.coffeesales.ae;
                client_max_body_size 10m;

                location /api/ {
                    proxy_pass http://127.0.0.1:3016/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    proxy_pass http://127.0.0.1:3018;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX
              ln -sf /etc/nginx/sites-available/admin.coffeesales.ae /etc/nginx/sites-enabled/admin.coffeesales.ae
              if ! nginx -t; then
                echo "nginx config invalid: removing admin.coffeesales.ae config"
                rm -f /etc/nginx/sites-enabled/admin.coffeesales.ae /etc/nginx/sites-available/admin.coffeesales.ae
                nginx -t
                exit 1
              fi
              systemctl reload nginx
              if [ -n "${{ secrets.CERTBOT_EMAIL }}" ]; then
                certbot --nginx -n --agree-tos -m "${{ secrets.CERTBOT_EMAIL }}" -d admin.coffeesales.ae --redirect || echo "WARNING: admin certificate not issued; admin stays on HTTP"
              fi
            fi
            sleep 15
            docker compose -f docker-compose.prod.yml ps -a
            echo "--- seed (skips existing rows) ---"
            docker compose -f docker-compose.prod.yml exec -T api node packages/api/dist/seed.js || echo "seed step failed"
            echo "--- api logs (last 60) ---"
            docker compose -f docker-compose.prod.yml logs --tail=60 api || true
            echo "--- local health ---"
            curl -s -m 5 -w " HTTP:%{http_code}\n" http://localhost:3016/api/health || echo "local health: no response"
            echo "--- listening ports 3016-3018 ---"
            (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':(3016|3017|3018) ' || echo "nothing listening on 3016-3018"
            echo "--- firewall ---"
            (ufw status 2>/dev/null | head -20) || echo "ufw not available"

      - name: Verify deployment health
        run: |
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -m 5 -o /dev/null -w "%{http_code}" https://coffeesales.ae/api/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ API Health Check: HTTP 200 - DEPLOYMENT SUCCESSFUL"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $HTTP_CODE"
            sleep 5
          done
          echo "❌ API Health Check Failed after 30 attempts"
          exit 1

      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Deployment completed successfully"
          echo "📍 Services available at:"
          echo "  - Menu App: http://coffeesales.ae"
          echo "  - API: http://coffeesales.ae/api"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed - check logs above"
          exit 1
