name: Mobile apps

# Builds the iPhone and Android apps (Capacitor) from the same React code as the websites.
# Run it from the Actions tab, or push a tag like mobile-v1.0.0. Nothing here touches the server.
#
# Optional secrets (the build still runs without them):
#   GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_STAFF  Firebase Android config (push) for each app
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     -> signed .aab for Google Play; without them a debug .apk for testing is built
on:
  workflow_dispatch:
  push:
    tags: ['mobile-v*']
  # Also check that the apps still build when a PR changes them.
  pull_request:
    paths:
      - 'packages/*/android/**'
      - 'packages/*/ios/**'
      - 'packages/*/capacitor.config.ts'
      - 'packages/*/src/**native*'
      - '.github/workflows/mobile.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: menu-app
            name: customer
            services: GOOGLE_SERVICES_JSON
          - app: admin-dashboard
            name: staff
            services: GOOGLE_SERVICES_JSON_STAFF
    defaults:
      run:
        working-directory: packages/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Firebase config (push)
        env:
          JSON: ${{ secrets[matrix.services] }}
        run: |
          if [ -n "$JSON" ]; then printf '%s' "$JSON" > android/app/google-services.json; echo "VITE_PUSH=1" >> "$GITHUB_ENV"; else echo "No Firebase config, push stays off in this build"; fi
      - run: pnpm build
      - run: npx cap sync android
      - name: Build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: packages/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$STORE_PW" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PW"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.name }}
          path: |
            packages/${{ matrix.app }}/android/app/build/outputs/apk/**/*.apk
            packages/${{ matrix.app }}/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    # Proves the iPhone projects build. Signed TestFlight uploads need the Apple certificate and
    # profile secrets, added once the Apple Developer account exists.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [menu-app, admin-dashboard]
    defaults:
      run:
        working-directory: packages/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build
      - run: npx cap sync ios
      - name: Build for the simulator (no signing)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
