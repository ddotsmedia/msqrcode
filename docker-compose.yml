# ═══════════════════════════════════════════════════════════════
# Milestones Coffee — Port Allocation
# ═══════════════════════════════════════════════════════════════
# API:              3000
# Menu App:         5173
# Admin Dashboard:  5174
# PostgreSQL:       5432
# Redis:            6379
# Adminer:          8080
# Prisma Studio:    5555
# ═══════════════════════════════════════════════════════════════

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: milestones-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-milestones}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: milestones-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    container_name: milestones-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/milestones
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - milestones-network
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: milestones-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - milestones-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  milestones-network:
    driver: bridge
