services:
  postgres:
    image: postgres:17-alpine
    container_name: milestones-postgres
    environment:
      POSTGRES_USER: milestones_user
      POSTGRES_PASSWORD: milestones_password
      POSTGRES_DB: milestones_coffee
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - milestones-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milestones_user -d milestones_coffee"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: milestones-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - milestones-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  milestones-network:
    driver: bridge
