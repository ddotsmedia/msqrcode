version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: msqrcode-postgres
    environment:
      POSTGRES_DB: msqrcode
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - msqrcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: msqrcode-redis
    ports:
      - "6384:6379"
    networks:
      - msqrcode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: msqrcode-api
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: msqrcode
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      LOG_LEVEL: info
    ports:
      - "3016:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - msqrcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  menu-app:
    build:
      context: .
      dockerfile: packages/menu-app/Dockerfile
    container_name: msqrcode-menu-app
    ports:
      - "3017:80"
    depends_on:
      - api
    networks:
      - msqrcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin-dashboard:
    build:
      context: .
      dockerfile: packages/admin-dashboard/Dockerfile
    container_name: msqrcode-admin-dashboard
    ports:
      - "3018:80"
    depends_on:
      - api
    networks:
      - msqrcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  msqrcode-network:
    driver: bridge
