version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: msqrcode-postgres
    environment:
      POSTGRES_DB: msqrcode
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - msqrcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: msqrcode-redis
    networks:
      - msqrcode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: msqrcode-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/msqrcode
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: msqrcode
      DB_SYNC: "true"
      REDIS_URL: redis://redis:6379
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MENU_PUBLIC_URL: https://coffeesales.ae
      CORS_ORIGIN: https://coffeesales.ae,https://www.coffeesales.ae,https://admin.coffeesales.ae
    ports:
      - "127.0.0.1:3016:3000" # only nginx on this server reaches it
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - msqrcode-network
    restart: unless-stopped

  menu-app:
    build:
      context: .
      dockerfile: packages/menu-app/Dockerfile
    container_name: msqrcode-menu-app
    ports:
      - "127.0.0.1:3017:80"
    depends_on:
      - api
    networks:
      - msqrcode-network
    restart: unless-stopped

  admin-dashboard:
    build:
      context: .
      dockerfile: packages/admin-dashboard/Dockerfile
    container_name: msqrcode-admin-dashboard
    ports:
      - "127.0.0.1:3018:80"
    depends_on:
      - api
    networks:
      - msqrcode-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  msqrcode-network:
    driver: bridge
