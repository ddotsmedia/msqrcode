# ═══════════════════════════════════════════════════════════════
# Milestones Coffee — Production Docker Compose
# ═══════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: milestones-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - milestones-network

  redis:
    image: redis:7-alpine
    container_name: milestones-redis-prod
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - milestones-network

  api:
    build:
      context: ./milestones-coffee
      dockerfile: packages/api/Dockerfile.production
    container_name: milestones-api-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3016:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - milestones-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  menu-app:
    build:
      context: ./milestones-coffee
      dockerfile: packages/menu-app/Dockerfile
    container_name: milestones-menu-prod
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3017:3002"
    depends_on:
      - api
    restart: always
    networks:
      - milestones-network

  admin-dashboard:
    build:
      context: ./milestones-coffee
      dockerfile: packages/admin-dashboard/Dockerfile
    container_name: milestones-admin-prod
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3018:3003"
    depends_on:
      - api
    restart: always
    networks:
      - milestones-network

volumes:
  postgres_data:
  redis_data:

networks:
  milestones-network:
    driver: bridge
